version: "3.9"
services:
    frontend:
        build: ./frontend
        ports:
            - "5173:5173"
        environment:
            - VITE_API_URL=http://localhost:4444
        depends_on:
            - backend
        networks:
            - app-network

    backend:
        build: ./backend
        ports:
            - "4444:4444"
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
